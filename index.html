 sites, the metro trunk, the long-haul trunks \u2014 hands its payload to this switch, which maps each circuit into a slot of the next wave. Cross-connects are software, so when a trunk fails the switch can re-point circuits onto another trunk in under a second. It is also the one box every circuit through this gateway depends on.",PNL:"<b>Patch panel (hard-patched gateway).</b> This smaller gateway has no switch. Circuits pass from one transponder or muxponder port to the next through physical jumpers placed by a technician. Cheap and simple, but a circuit can only be moved by someone standing here \u2014 so nothing reroutes automatically, and one pulled jumper breaks one circuit while every wavelength stays up.",MUX:"<b>Mux / demux.</b> A passive filter: combines the transponders' wavelengths onto one fiber and separates them on the way back. Each port passes exactly one colour \u2014 which is why a restored wavelength cannot simply change channel.",TXP:"<b>Transponder.</b> Client side: grey short-reach optics to the router. Line side: a coherent pluggable tuned to one ITU channel. In between it wraps the client in OTN with forward error correction. Its <b>pre-FEC BER</b> is the best early-warning number in the whole network.",PSU:"<b>\u221248 V DC power feed.</b> A and B feeds come from separate breakers and battery strings; either one carries the shelf. Losing one is a minor alarm with a short fuse \u2014 lose the second and the node goes dark.",FAN:"<b>Fan tray.</b> Not traffic-affecting at first. The shelf heats up and cards shut down thermally if it is not swapped (here: temperature alarm after 15 s, first amplifier lost after 45 s, then another card every 20 s until the tray is replaced).",OSC:"<b>Optical supervisory channel.</b> A separate 1510 nm signal outside the amplifier band, terminated at every site. Carries management and span-loss telemetry to huts that have no other connectivity. Because it is not amplified it survives amplifier failure: <b>line LOS + OSC LOS = fiber path broken; line LOS + OSC up = amplifier</b>."},us=e=>{let t=e.a,a=t.id;for(const i of e.p)t=i.a===t?i.z:i.a,a+=" \u203A "+t.id;return a},pa={"IP-CONGESTION":"More traffic is offered to a router link than it can carry. Nothing is down, so no circuit alarm fires \u2014 customers just see loss and slowness. Find which link failed and pushed its load here.","LAG-DEGRADED":"A bundle of parallel circuits lost a member. The link stays up at reduced capacity.","IP-LINK-DOWN":"All member circuits of a router link are down. The routers reconverge onto other links.",TIM:"Trace identifier mismatch: the signal is healthy but carries the name of a different circuit. Almost always a jumper on the wrong port.","CLIENT-LOS":"No light on the hand-off port while the line side is healthy: look at the jumper between the two.","CLIENT-RX-LOW":"Light arrives at the hand-off port, but too weak. A dirty or badly seated connector is the usual cause.",LOS:"Total power into the line port fell below threshold: every wavelength and the OSC disappeared at once. Both ends of one span reporting this means the fiber path between them is broken \u2014 a cut, or a patching error at a panel. The OTDR tells those apart.","OSC-LOS":"Supervisory channel lost on this span. Together with line LOS it confirms the fiber path is broken. Alone, with line power normal, it points at an OSC SFP or filter \u2014 traffic is fine, but the far site may be unmanageable.",ALS:"Automatic laser shutdown. The booster facing a broken span mutes itself for eye safety. Expected consequence, not a fault.","LOS-IN":"This amplifier has nothing to amplify, but its own span is intact. A symptom: walk upstream until you find the first site that still has light.",EQPT:"A card reports hardware failure, or the shelf lost contact with it.",PLUG:"Pluggable optic failed. The cheapest fix in the network: swap it and clean the connectors.","OCH-LOS":"This transponder's coherent receiver lost its wavelength. A per-channel symptom of something upstream on its path.",BDI:"Backward defect indication: the far end is telling us it cannot hear us. The fault is in <i>our transmit</i> direction.",CSF:"Client signal fail: the far-end client port lost its router signal, so this end sends Local Fault to its own router. The optical line is healthy.","FEC-DEG":"Pre-FEC bit error rate is climbing; OSNR margin is thin. Still error-free after correction \u2014 this is the early warning to act on. Check the performance history to see when it started.","FEC-UNC":"FEC can no longer correct the errors: OSNR is below what this modulation needs. Light is present, frames are not.","SPAN-LOSS":"Measured span loss is above baseline: a tight bend, dirty connector, bad splice or water in a closure. Every channel on the span loses OSNR, and the densest modulations fall over first.","RX-LOW":"Power arriving here is below baseline but the span loss measured by the OSC is normal \u2014 so the fiber is fine and the upstream amplifier is launching low.","GAIN-LOW":"The amplifier is at maximum pump current and still under its gain target. Classic ageing. Replace in a maintenance window before it takes services down.",FLAP:"The span keeps going down and coming back. Usually a marginal connector or a damaged jumper \u2014 not a cable cut. Wait-to-restore timers exist because of this.","CABLE-DMG":"Other fibers in this cable are broken. Our pair survived, but a repair crew will be working in that splice closure next to our live fibers.",MAINT:"Administrative state: planned work. Alarms on this span are expected and downgraded.","AC-FAIL":"Commercial power is gone. On generator this is routine. On battery only, a clock is running.","BATT-LOW":"Battery is nearly empty.","TEMP-HIGH":"Shelf inlet temperature is rising because the fan tray failed.","SVC-DOWN":"End-to-end service is not carrying traffic.","PROT-SW":"1+1 selector is on the protect leg.","PROT-UNAVAIL":"The standby leg is broken. Traffic is fine, but treat as urgent: the next failure is an outage.",RESTORING:"Control plane is building a new route.",RESTORED:"Service is on an alternate route.","NODE-DOWN":"The whole site lost power."},Kt=(e,t)=>(xe(e,t,-1),{k:2,s:[e.i],c:"cut"}),ka=(e,t,a,i)=>{const n=Ci(e,t,a);return i>=0?n.ports[i].failed=!0:n.failed=!0,{k:4,n:e,c:[n.i],p:i}},Ct=[{t:"Customer down, ring is green",b:'"BANK-HQ says their circuit dropped two minutes ago. Nobody else is complaining."',set:()=>Kt(S["BANK-HQ"].sp[0],.25),h:["Scope first: is it one wavelength, or everything on some fiber?","BANK-HQ is single-threaded: one lateral. Which two sites report LOS toward each other? Select that lateral and run the OTDR."],x:"The BANK-HQ lateral is cut between the building and the splice case; both ends report line LOS and the OTDR shows a reflective break. The site is single-threaded, so its access wave \u2014 and the circuit riding it \u2014 stays down until the splice is done."},{t:"Alarm storm on the long-haul",b:'"Dozens of alarms in one second across Highway 1. Both 400G trunks between Aurora and Vale are affected. Where do we send the truck?"',set:()=>Kt(oe.AV[2],.37),h:["Ignore per-channel alarms for now. Which sites report LOS on a <i>line</i> port \u2014 and is their OSC gone too?","Two neighbouring huts each report LOS + OSC-LOS toward the other. Select the span between them and run the OTDR."],x:"Fiber cut between two huts on Highway 1. Now look at how the layers reacted. In under a second the OTN switches at the gateways re-pointed most circuits onto other trunks. A few seconds later the optical layer tried to restore the trunk waves over a detour \u2014 the event log shows which attempts succeeded and why the others did not. Open the Tickets tab: most customers never had an outage."},{t:"One-way silence",b:'"Highway 1 again \u2014 but this time the huts still answer and nobody reports OSC loss."',set:()=>ka("ILA-AV4","AMP","B>A",-1),h:["If the fiber were broken, both directions and the OSC would be gone. Are they?","Find the last site in the dark direction that still has input light. The fault is right there."],x:"One amplifier in a hut failed. One direction only, OSC intact on both adjacent spans: that rules out fiber. The trunks still go down in both directions, because a wavelength with one dead direction is useless \u2014 the far end says so with BDI."},{t:"Router says down, optics say fine",b:'"STADIUM reports their router port toward us is down. Our transport dashboard is almost empty."',set:()=>ka("STADIUM","TXP","",1),h:["Is there any line-side alarm at all?","CSF at the gateway end means the <i>customer</i> end lost its client signal. Open that terminal and run the loopback test."],x:"The client pluggable on the STADIUM terminal failed. The access wave is healthy end to end; only the grey optic toward the customer router died. The gateway end sees Client Signal Fail. The loopback test localises exactly this."},{t:"Protected \u2014 and down anyway",b:'"HOSPITAL has two laterals and a 1+1 access wave. It is hard down. Both laterals look intact."',set:()=>ka("HOSPITAL","TXP","",-1),h:["1+1 protects the path. What do both legs have in common?","Both legs lost light at the same instant. Look where they start."],x:'The transponder in the HOSPITAL terminal failed. 1+1 bridges one transmitter onto two laterals: it protects fiber, not the shared terminal equipment. Sites that need more buy two circuits on two terminals \u2014 try that in Design mode with "Diverse".'},{t:"Nothing is dark",b:'"Seven circuits to and through Calder went down together. No fiber is dark. Every access wave is clean."',set:()=>{const e=oe.AC[0];return e.degr=10,{k:2,s:[e.i],c:"loss"}},h:["What do the seven circuits share? Open one and read its layout record.","A 400G trunk needs far more OSNR than a 10G or 100G access wave. Find the span whose loss is above baseline."],x:"One span of the Southern Rail route picked up 10 dB of extra loss. The amplifier restored the power but not the noise. The 400G trunk between Aurora and Calder had under 2 dB of margin and fell over, taking every circuit groomed into it. And because the Calder gateway is hard-patched, nothing could move those circuits to another trunk."},{t:"Did we lose a hut?",b:'"Monitoring shows an OSC alarm on the Southern Rail route. No customer tickets."',set:()=>ka("ILA-AC2","OSC","",0),h:["Is any circuit actually affected?","OSC-LOS at a neighbour with normal line power means it stopped <i>hearing</i> the OSC. Who is supposed to be sending it?"],x:"An OSC SFP in a hut failed. Traffic never noticed \u2014 the OSC is out of band. But that span lost its telemetry and the hut may now be reachable from one side only. Low severity, real urgency."},{t:"Diverse on paper",b:'"Aurora just lost its trunks to Vale AND to Northgate in the same second. Those run on two different routes. Leadership wants to know how that is possible."',set:()=>(_n(la[0]),{k:2,s:la[0].sp.map(e=>e.i),c:"cut"}),h:["Two long-haul spans on different routes failed in the same second. Coincidence is rare in outside plant.","Look at the map where those two routes cross the West River. Select either failed span and read what the inspector says about shared risk."],x:"Highway 1 and the Northern Rail cross the West River on the same bridge, and both cables hang in one conduit under it \u2014 a shared-risk group. Both line systems on Highway 1 and the Northern Rail system went dark together. Whatever came back did so the slow way, through optical restoration over the long southern detour. Logical diversity is not physical diversity: ask where your routes cross water, rail and tunnels."},{t:"After the maintenance window",b:'"Night shift finished a card swap at VLY-HUB an hour ago and closed the change. Day shift finds a ring span dark."',set:()=>{const e=$t("VLY-HUB","VLY-DC1");return e.patch=!0,{k:2,s:[e.i],c:"patch"}},h:["The alarms look exactly like a cut. What tool tells a cut from everything else?","The OTDR sees continuous fiber. So the light is being sent into the wrong place."],x:'Tx and Rx were swapped at the patch panel when the jumpers were reconnected. Alarms are identical to a cut \u2014 LOS and OSC-LOS at both ends \u2014 but the OTDR trace is clean. Always ask "what changed?" before dispatching a splice crew.'},{t:"The clock is running",b:'"Storm in the hills. A hut on Highway 5 between Northgate and Vale reports a power alarm. Traffic is fine. For now."',set:()=>{const e=S["ILA-NV1"];return e.ac=2,e.battEnd=x+45,{k:1,n:e.id}},h:["Nothing is down yet. Which alarm has a countdown attached?","Select the hut on the map and look at its power state."],x:"Commercial power failed at the hut and the generator did not start. The site runs on battery until it does not \u2014 then the trunk through it drops. This is the one fault type where the NOC can prevent the outage: fuel and a generator tech, now."},{t:"Restoration that never came",b:'"The Northgate\u2013Vale trunk has been down for a minute and optical restoration reports failure. Yet there is not a single customer outage ticket."',set:()=>Kt(oe.NV[1],.5),h:["Find the cut first \u2014 that part is easy.","Then open the trunk wave and read why restoration failed, and open one of the circuits to see which trunks it rides now."],x:"Two lessons in one cut. Optical restoration failed on wavelength contention: every detour already carries another trunk on channel 3, and a wavelength cannot change colour mid-route. But the circuits survived anyway, because the OTN switches at Northgate and Vale re-pointed them onto other trunks. Two layers, two independent chances."},{t:"Slow burn",b:'"No hard alarms. One 400G trunk drifted toward the FEC limit for a while, and now it is down."',set:()=>{const e=Ci("ILA-AC3","AMP","A>B");return e.weakT=x-34,e.weak=5.6,it=x+1,{k:4,n:"ILA-AC3",c:[e.i],p:-1}},h:["Open the trunk wave and look at its margin history: a step, or a slope?","A hut reports low received power while its span loss is normal. So who is launching low?"],x:"A pump laser in a hut is ageing: output sagged gradually and tilted across the band. No LOS, no span-loss alarm \u2014 only RX-LOW at the next hut and a BER trend. Performance history is how you catch this weeks early."},{t:"It keeps coming back",b:'"The Port Meridian metro trunk to the data center has switched to protect and back four times in a minute. Customers see bursts of errors."',set:()=>{const e=$t("MER-HUB","MER-DC1");return e.flap=x+2,{k:2,s:[e.i],c:"flap"}},h:["Which span is bouncing? The FLAP alarm counts transitions.","A cable cut does not heal itself. What does?"],x:"A marginal connector on a ring span is making intermittent contact. Each bounce triggers a protection switch on the metro trunk. Wait-to-restore holds traffic on the protect leg so the trunk does not follow every bounce \u2014 which is the whole reason that timer exists."},{t:"One cut, many tickets",b:'"Aurora metro: a ring span went down, which the ring should absorb. But several customer tickets opened in the same second."',set:()=>Kt($t("AUR-HUB","AUR-DC1"),.15),h:["Find the ring span with LOS at both ends. That explains the metro trunk switching to its protect leg.","Now select that ring span and read which customer laterals are spliced into the same cable."],x:"Customer laterals do not run all the way to a POP. They are spliced into the ring cable at a splice case in the street and ride spare pairs inside it. A ring cable cut between a splice case and the POP breaks the ring span <i>and</i> every lateral riding that section. Single-threaded sites go down; dual-lateral and ring-diverse sites switch to their other leg. Notice one more casualty: the unprotected trunk to Calder uses this same ring span to reach its long-haul route."},{t:"Second strike",b:'"Known issue: the Aurora ring span between the hub and the data center was cut an hour ago, crew on site, the metro trunk has been on its protect leg since. Thirty seconds ago every Aurora data-center circuit went hard down."',set:()=>{const e=$t("AUR-HUB","AUR-DC1");return xe(e,.6,-1),e.shown=!0,Kt($t("AUR-POP2","AUR-DC1"),.5)},h:["The first cut is known and marked on the map. It is not the answer.","A trunk running on its protect leg has no protection left. Where does that leg run, and what happened on it?"],x:"A second, unrelated cut on the other side of the ring took out the protect leg while the working leg was still under repair. Double faults are how protected services actually go down. The PROT-UNAVAIL alarm that had been standing for an hour was the warning."},{t:"The change that went wrong",b:`"Tonight's approved change: fiber work on the Vale ring span VLY-HUB \u2194 VLY-DC1, window is open and traffic was drained. Now the trunk to Aurora, which has nothing to do with that span, is down."`,set:()=>{const e=$t("VLY-HUB","VLY-DC1");e.maint=!0;const t=S["VLY-HUB"].deg[oe.AV[oe.AV.length-1].i][1];return t.failed=!0,{k:4,n:"VLY-HUB",c:[t.i],p:-1}},h:["The maintenance span itself is behaving as planned. What else is at that site?","The technician is standing in front of VLY-HUB. Which degree lost everything at the moment the work started? RTRV-PM in the console shows it."],x:"The technician reseated the WSS of the wrong degree \u2014 the one facing Highway 1, not the ring span in the change ticket. Classic maintenance-induced outage: the timing matches the window, the location matches the site, but the affected traffic is the wrong traffic."},{t:"Clean optics, dead wave",b:'"One single-threaded customer is down. One wavelength only. No fiber alarms, no equipment alarms, power levels on every span look normal."',set:()=>{const e=M.find(a=>a.kind==="acc"&&a.prot==="none"&&a.paths[0].ns.length>2),t=e.paths[0].ns[1];return e.xc=t,{k:4,n:t.id,c:t.cards.filter(a=>a.core&&e.paths[0].e[0].includes(a)).map(a=>a.i),p:-1}},h:["Everything else on the same fibers is fine, so the glass and the amplifiers are fine. What is specific to one wavelength at a ROADM?","Open the Console tab and run RTRV-CRS on each ROADM along the wave's route."],x:"Someone deleted the wavelength cross-connect for this channel on a ring ROADM while cleaning up another service. The WSS simply stopped passing that colour. Nothing is broken, so nothing alarms except the transponders at the ends. Comparing provisioned cross-connects against the route plan is the only way to find it."},{t:"Every wave is up",b:'"A customer circuit through the Calder gateway is down. Every wavelength it rides is up, with normal margins."',set:()=>{const e=N.find(t=>t.gws.includes(ye.CAL)&&t.A.type===4&&t.gws.length>1);return e.xcBad=ye.CAL,{k:4,n:"CAL-HUB",c:[ye.CAL.xc.i],p:-1}},h:["Open the Tickets tab, select the circuit and read its layout record. Each segment is fine \u2014 so where can it still be broken?","A circuit is a chain of waves joined at gateways. Which gateway on this one is joined by hand?"],x:"A jumper was pulled from the Calder patch panel during unrelated work. Calder is a hard-patched gateway: circuits pass from one transponder to the next through physical jumpers, and one missing jumper breaks exactly one circuit while every wavelength stays up. At an OTN-switched gateway the same fault is a deleted cross-connect \u2014 fixable from a keyboard."},{t:"Right card, wrong colour",b:'"The transponder at TV-STATION was swapped an hour ago. The circuit has not passed a bit since. The technician swears the new card is healthy, and its transmit power is perfect."',set:()=>{const e=Ci("TV-STATION","TXP","");return e.mis=!0,{k:4,n:"TV-STATION",c:[e.i],p:-1}},h:["The card is transmitting. So why does the far end see nothing on that channel?",'Open the card and compare "Provisioned channel" with "Laser tuned to".'],x:"The replacement transponder came up on the wrong channel. Its light is healthy, but the mux port only passes the provisioned colour, so the wave dies at the first filter. Nothing is broken; a number is wrong. After any card swap, verify frequency before you close the ticket."},{t:"Edge of the band",b:'"The trunks out of Aurora toward Calder are taking errors and dropping. Span losses are normal, amplifiers report normal gain, nothing is dark."',set:()=>{const e=S["AUR-DC1"],t=e.deg[oe.AC[0].i][1];return t.tilt=!0,{k:4,n:e.id,c:[t.i],p:-1}},h:["Select the first long-haul span of that route and look at the spectrum strip: are all channels arriving at the same height?","Something upstream of that span is supposed to keep the channels level. Which card does that?"],x:"The WSS feeding the Southern Rail route stopped equalising. Channel powers drifted apart until the ones at the edge of the band arrived several dB low \u2014 enough to take down 400G waves with little margin, while total power and span loss looked perfectly normal. Per-channel power is the only place this shows."},{t:"Backhoe at the door",b:'"CITY-HALL pays for a protected circuit: two fiber pairs, opposite ways around the Aurora ring. Both went dark in the same second."',set:()=>{const e=S["CITY-HALL"];return xe(e.sp[0],.03,-1),{k:2,s:[e.sp[0].i,e.sp[1].i],c:"cut"}},h:["Two diverse paths failing together means they are not diverse somewhere. Where do they run side by side?","Open the CITY-HALL chassis and look at the building drawing under the shelf."],x:"CITY-HALL has ring diversity but a collapsed entrance: both fiber pairs leave the building in one duct. A contractor dug through it a few metres from the door. On paper the circuit was protected; in the ground it was single-threaded for the last stretch. Ask for separate entrances, not just separate ring directions."},{t:"Half a bundle",b:'"Aurora users say everything toward Vale has crawled since a technician tidied the Aurora meet-me room an hour ago. No customer circuit is down. One ticket is open \u2014 on a router link."',set:()=>{const e=Fe[0].m[1];return e.mmr=ye.AUR,e.mmrK=2,{k:5,ck:e.i,n:"AUR-HUB"}},h:["Open the IP layer tab. Which link is running on fewer members than it should, and how full is it?","The member circuit is down while every wave under it is up. Open AUR-HUB and look at the meet-me room at the bottom, or read the alarm on that circuit."],x:"One jumper in the Aurora meet-me room was put back on the wrong port. That killed one 100G member of the Aurora\u2013Vale bundle. The link stayed up on the other member, so nothing looked down \u2014 but 110 G of traffic was now offered to 100 G, and the routers dropped the rest. A trace-identifier mismatch is the tell: light arrives, from the wrong circuit."},{t:"Up, but slow",b:'"Port Meridian users report packet loss toward Vale. Every customer circuit is up or rerouted. Optical alarms are few."',set:()=>{const e=Gt["TRK AUR-MER X1"],t=S["CAL-POP3"].rg[e.id];return t[0].failed=!0,{k:4,n:"CAL-POP3",c:[t[0].i,t[1].i],p:-1}},h:["The IP layer tab shows one link down and another over 100%. Which link went down, and what does it ride on?","That express trunk does not stop at a gateway on the way. Where is it regenerated?"],x:"The regenerator for the Aurora\u2013Port Meridian express trunk failed at Calder. OTN switching moved the customer circuits within a second. The router link is not OTN-restored, so the routers sent 45 G of Aurora\u2013Meridian traffic through Vale instead \u2014 onto a 100 G link that was already carrying 60. Nothing was down; one link was simply too small for the detour. Capacity planning has to cover the failure case, not the sunny day."},{t:"Clean before you connect",b:'"BREWERY moved their router to a new rack this morning. Their circuit has been down since. Our transponder at the site reports no equipment fault."',set:()=>{const e=N.find(t=>t.A.id==="BREWERY");return e.mmr=e.A,e.mmrK=3,{k:5,ck:e.i,n:"BREWERY"}},h:["The access wave is up end to end. So the problem is not between our two transponders.","Read the alarm at the site: how much light does our client port receive from the customer router?"],x:'When the customer re-cabled, the connector at the demarc panel picked up dirt. Our line side was e wavelength."],["ILA","In-line amplifier site: a hut with amplifiers and nothing else."],["IRU","Indefeasible right of use: a long-term lease of fiber strands to another carrier."],["Lateral","The cable from a customer building to a splice point on the metro ring cable."],["Layout record","The design record of a circuit: every segment and cross-connect from A to Z."],["LGX","A fiber patch panel. Positions are panel number and port pair."],["LOS","Loss of signal: optical power below threshold at a receiver."],["Meet-me room","The room in a carrier hotel or data center where networks cross-connect to each other."],["Muxponder","A card that packs several client signals into one line wavelength."],["NLI","Nonlinear interference: noise created by the signals themselves at high power in the fiber."],["OSC","Optical supervisory channel at 1510 nm, terminated at every site, used for management and span telemetry."],["OSNR","Optical signal-to-noise ratio. Higher-order modulation needs more of it."],["OTDR","Optical time-domain reflectometer: locates breaks and loss events by distance."],["OTN switch","An electrical switch that cross-connects circuits between wavelengths in software."],["Raman","Amplification inside the transmission fiber itself; used on long spans to improve noise."],["Regenerator","Back-to-back transponders that receive, correct and re-send a wave, resetting its noise."],["Restoration","The control plane finding a new optical route after a failure. Seconds, not milliseconds."],["ROADM","Reconfigurable optical add/drop multiplexer: a node that switches wavelengths between fiber directions."],["SRG / SRLG","Shared-risk group: things that fail together because they share a trench, bridge, tunnel or cable."],["Splice case","A sealed closure where fibers of two cables are fused together."],["TID","Target identifier: the name of a network element, here the CLLI plus a 3-character entity code."],["Tilt","Uneven power across the band. Edge channels lose margin first."],["Trunk","A high-capacity wave between gateways carrying many circuits."],["WSS","Wavelength-selective switch: steers each colour to a chosen port."],["WTR","Wait-to-restore: the delay before traffic reverts to a repaired path."],["1+1","Protection where the signal is sent on two paths at once and the receiver picks one."]];function Ms(){for(let e=0;e<$.length;e++){const t=$[e];t.otdrAt&&x>=t.otdrAt&&(t.otdrAt=0,t.otdr=lo(t),se=1)}}const te={dim:1,bloom:1,rm:0};let vt=0,Dt="",Ea=0,ba=0,Ui=0;const pe=(e,t)=>`<a class="sm" data-act="show" data-v="${e}">${t||"show me"} \u25B8</a>`,ri={CTRL:["Management ports only; nothing optical.","Site goes grey in the NMS, no new alarms from it, and it cannot be re-provisioned. Traffic keeps flowing.","c:AUR-HUB:CTRL"],AMP:["IN and OUT, one fiber each. A degree has a booster and a pre-amp on one card; a hut has one card per direction.","One direction goes dark downstream while the OSC stays up on both sides. Ageing shows as low receive power at the next site with normal span loss.","c:ILA-AV2:AMP"],WSS:["COM toward the line amplifier, EXPRESS ports to the other degrees, ADD/DROP toward the mux.","Everything on that degree drops, both local and express, while the fiber and amplifier report normal. A frozen equalisation loop tilts the spectrum instead.","c:AUR-HUB:WSS"],ACC:["LINE to the lateral, COM to the mux.","Only the one customer behind that lateral is affected.","c:AUR-POP2:ACC"],OTN:["Client-side ports from every transponder at the gateway. Two fabrics, A and B.","One fabric lost: an alarm, no traffic impact. Both lost: every circuit through the gateway is down although all waves are up.","c:AUR-HUB:OTN"],PNL:["One jumper position per circuit.","A pulled or misplaced jumper takes down exactly one circuit while every wave is up.","c:CAL-HUB:PNL"],MUX:["One COM port and one fixed-colour port per channel.","Passive, so it rarely fails; a transponder on the wrong colour dies here.","c:AUR-HUB:MUX"],TXP:["LINE (coherent, colo <h4>Map</h4><ul><li><b>Drag</b> to pan. <b>Wheel</b> or <b>pinch</b> to zoom. Hover for a name.</li><li><b>Click</b> a site, a fiber or empty space to select or clear. <b>Double-click</b> a site to open its chassis. <b>Esc</b> returns to the map.</li><li>Zoom in and each fiber splits into its wavelengths, one moving strand per wave per direction.</li><li>Selecting something dims the rest. The selected path gets a pale casing and a pulse running from A to Z; a second (protect) path is dotted.</li><li><b>F</b> shows frames per second and the worst frame time.</li></ul>
<h4>Left panel</h4><ul><li><b>Circuits / Wavelengths</b> switch: what customers buy versus what the optical layer carries. Groups fold. Click a row to select it; click again to clear.</li><li>In Drills, Live shift and Design the panel shows that mode's briefing, hints and controls instead.</li></ul>
<h4>Right panel: the inspector</h4><ul><li>Shows whatever is selected: a site, a span, a wave, a circuit, a card or a pluggable.</li><li>Grey chips are links: click to jump to that object.</li><li><b>Break it</b> buttons are red, repairs are green. They are hidden in Drills and Live shift, where <b>Declare</b> buttons appear instead.</li></ul>
<h4>Bottom panel</h4><ul><li><b>Alarms</b>: click a row to jump to its source. <b>ack</b> marks it as seen. <b>Correlate</b> hides symptoms and keeps root causes (off while a cause is hidden from you).</li><li><b>Event log</b>: what happened, in order, including what the network did by itself.</li><li><b>Tickets</b>: one per affected circuit, with SLA clock, next action, owner and <b>escalate</b>. <b>Shift handover report</b> is here.</li><li><b>IP layer</b>: router links, their load and what moved.</li><li><b>Console</b>: typed commands. See the Console chapter.</li><li><b>Hide / Show</b> collapses the panel.</li></ul>
<h4>Chassis view</h4><ul><li>Shelves, cards and pluggables of one site. Yellow cords are patch fibers; moving colours are wavelengths.</li><li>Click a card or a pluggable to inspect, fail or replace it.</li><li>Under the shelves: the <b>power plant</b> in a hut, the <b>building and outside plant</b> at a customer site, the <b>meet-me room</b> at a gateway or data center. Entrances and jumpers there are clickable.</li></ul>`],["The network",`<h4>Geography</h4><p>Five mainland metros: Aurora in the west beyond the West River, Vale in the central valley, Northgate under the Northern Range, Calder toward the south coast and Port Meridian on the east coast. Each is a four-site fiber ring (hub, data center, two POPs) with ten customer sites. Eight long-haul routes follow highways and rail lines between them, with an amplifier hut every 60 to 110 km. A sixth, small metro, <b>Corran</b>, sits on Kestrel Island with four customer sites. ${pe("n:VLY-HUB","show Vale")}</p>
<h4>Layers</h4><ul><li><b>Fiber</b>: cables in the ground. See the Fiber chapter.</li><li><b>Line systems</b>: one lit fiber pair with its amplifiers, terminal to terminal. Named CLLI/CLLI/DWnn.</li><li><b>Wavelengths</b>: access waves (site to gateway), metro trunks (gateway to data center), long-haul trunks (gateway to gateway, 400G).</li><li><b>Circuits</b>: what the customer buys. A chain of waves cross-connected at every gateway on the way.</li><li><b>IP</b>: routers whose links are themselves circuits.</li></ul>
<h4>How one circuit is built</h4><p>From a customer site: an <b>access wave</b> over the lateral and round the ring to the metro gateway. There it is cross-connected into a slot of a <b>400G trunk</b>. At the far gateway it is cross-connected again, onto a metro trunk to a data center or an access wave to another customer. Open any circuit and read its <b>layout record</b> top to bottom. ${pe("k:STEEL-WORKS","show a three-metro circuit")}</p>
<h4>Gateways</h4><ul><li>Every metro has two: the hub (primary) and the data center (second). Diverse circuit pairs use one each.</li><li>Aurora, Port Meridian, Vale and Northgate have <b>OTN switches</b>: circuits move between trunks in software, in under a second.</li><li>Calder is <b>hard-patched</b>: jumpers on a panel. Nothing reroutes by itself there.</li></ul>
<h4>The island and its subsea cable</h4><p>Corran is reached by one cable across the Meridian Strait, from Port Meridian. It leaves the mainland at <b>Meridian Landing</b>, crosses the seabed through four <b>submerged repeaters</b> and comes ashore at <b>Corran Landing</b>. The repeaters have no power of their own: the two landing stations feed a constant current down the cable, and either one can feed all four. A landing station's own amplifiers are in the light path, though, so a dark station still takes the cable down. A cut at sea needs a cable ship, which takes far longer than a splice crew. There is no second cable, so while it is down the island is cut off from the mainland; traffic that stays on the island keeps working. ${pe("n:COR-HUB","show Corran")} ${pe("w:TRK MER-COR 1","show the subsea trunk")}</p><h4>Special cases</h4><ul><li><b>Second line system</b>: Highway 1 (Aurora, Vale, Port Meridian) lights fibers 3\u20134 as DW02, with its own amplifiers. Same cable, so a cut takes both.</li><li><b>Express trunk</b>: Aurora to Port Meridian on the southern route without stopping at the Calder gateway; it is regenerated at CAL-POP3. ${pe("w:TRK AUR-MER X1")}</li><li><b>Shared-risk groups</b>: the West River bridge and East River tunnel each carry two long-haul routes. Amber diamonds on the map.</li></ul>
<h4>Names</h4><ul><li><b>CLLI</b>: 4 letters city, 2 state, 2 building. AURRWEMA is Aurora, state WE, main hub.</li><li><b>TID</b>: CLLI plus entity: R01 ROADM, A01 amplifier hut, T01 customer terminal.</li><li><b>AID</b>: shelf-slot or shelf-slot-port inside one element.</li><li><b>Circuit ID</b>: rate.A-CLLI.Z-CLLI.serial, for example 10GE.AURRWEBN.AURRWEDC.001.</li><li><b>Cable ID</b>: CBL-clli-clli for trunks and rings, LAT-clli for laterals.</li></ul>`],["Fiber",`<h4>Cable, tube, strand, pair</h4><p>A span on the map is one <b>cable</b>: 288 fibers on rings and long-haul, 24 on laterals. Fibers sit twelve to a <b>buffer tube</b>. A DWDM system uses one <b>pair</b>: one strand per direction. Fibers are numbered from 1; pair 1 is fibers 1\u20132. ${pe("s:AV","show a long-haul span")}</p>
<h4>Reading the fiber assignments</h4><p>Select a span. The coloured grid has one cell per pair:</p><ul><li><b>Blue</b>: lit by our line system on this span.</li><li><b>Pink</b>: the second line system (DW02).</li><li><b>Amber</b>: reserved for a future system.</li><li><b>Violet</b>: leased to another carrier (an IRU). Not ours to touch.</li><li><b>Green</b>: carrying a customer lateral that is spliced into this cable.</li><li><b>Grey</b>: dark spare. <b>Dark red</b>: dead, known bad.</li><li>Hover any cell for its fibers, its owner and whether it is broken.</li></ul>
<h4>Fiber trace</h4><p>The span inspector lists the whole line system end to end: each cable, which fibers, and the patch panel position (<b>LGX</b> panel and port pair) at each site. That is the record a field technician works from.</p>
<h4>Laterals and splice cases</h4><p>A customer lateral does not run to a POP. It runs a few kilometres to a <b>splice case</b> on the ring cable and continues on a spare pair inside that cable. So a ring cable cut can take down customers whose own lateral is intact. ${pe("l:BANK-HQ","show a lateral")}</p>
<h4>Three kinds of customer entrance</h4><ul><li><b>Single-threaded</b>: one lateral, one entrance, one path.</li><li><b>Dual lateral</b>: two laterals out of separate sides of the building to different sections of the ring.</li><li><b>Collapsed</b>: both ring directions, but one duct out of the building. Protected against a ring cut, not against a backhoe at the door. ${pe("n:CITY-HALL")}</li></ul>
<h4>Cutting and damaging fiber</h4><ul><li><b>Cut the whole cable</b> at the point you clicked, or <b>crush one buffer tube</b>: ours, or a different one that misses our pair.</li><li><b>Add 10 dB loss</b>: a pinched cable or a dirty connector. Light still arrives, with less margin.</li><li><b>Intermittent connector</b>: the span flaps up and down.</li><li>A <b>patching error</b> (TX and RX swapped at a panel) looks like a cut until you run the OTDR.</li></ul>
<h4>Finding and fixing</h4><ul><li><b>OTDR</b>: shoots light down the fiber and reports distance to the break, or shows continuous fiber. It takes three seconds.</li><li><b>Roll to a spare pair</b>: after a partial cut, move the system to an intact dark pair at both panels. Minutes instead of hours.</li><li><b>Dispatch splice crew</b>: drive time from the nearest staffed gateway plus splice time that grows with the number of broken fibers.</li><li><b>Maintenance window</b>: drains protected and restorable traffic off a span before planned work.</li></ul>`],["Equipment",()=>Object.keys(Bn).map(e=>`<h4>${Bn[e]}</h4><p>${oo[e]}</p><p><b>Ports:</b> ${ri[e][0]}<br><b>When it fails:</b> ${ri[e][1]} ${pe(ri[e][2])}</p>`).join("")+`<h4>Pluggable optics</h4><p>The small modules in card ports. <b>Client</b> (blue) is grey short-reach light to a router. <b>Line</b> (white) is the coherent coloured laser. <b>OSC</b> (orange) is the 1510 nm supervisory SFP. A failed pluggable is the cheapest repair in the network: swap it, clean the connector.</p><h4>Regenerator</h4><p>Two transponders back to back in the middle of a long wave. The signal is received, error-corrected and sent again, so noise starts from zero. Used where a path is too long for its modulation. If it fails, the wave is cut in the middle. ${pe("c:CAL-POP3:TXP")}</p><h4>Loopback test</h4><p>On a transponder: loop the client side or the line side back on itself. If the client loop passes and the circuit is still down, the fault is on the line; if it fails, look at the grey optic or the router.</p><h4>Shelves</h4><p>Shelf 1 is the photonic layer (amplifiers, WSS, mux, controller, power). Shelf 2 holds trunk transponders and the cross-connect at a gateway. Shelf 3 holds the access waves arriving from customer sites.</p>`],["Sites",`<h4>Hub and POP (ROADM)</h4><p>One <b>degree</b> per fiber direction: an amplifier and a WSS. Local traffic: transponder, mux, WSS, amplifier, line. Express traffic: amplifier, WSS, WSS, amplifier, and never touches a transponder. The hub is also the metro's primary gateway. ${pe("c:AUR-HUB:WSS","open a hub")}</p>
<h4>Data center</h4><p>A ROADM where many circuits end. It is the second gateway of its metro and has the larger <b>meet-me room</b>: one LGX port pair per hand-off, jumpered to a customer cage or a core router. Click a jumper to select its circuit. ${pe("n:VLY-DC1")}</p>
<h4>Amplifier hut (ILA)</h4><p>Unmanned. One amplifier per direction per line system, an OSC, a controller. Nothing is converted to electrical. Under the shelf is the <b>power plant</b>: commercial AC, rectifiers, battery string, generator. If AC fails and the generator does not start, the battery bar counts down to a dark site. ${pe("c:ILA-AV2:AMP","open a hut")}</p>
<h4>Customer terminal</h4><p>A small shelf: one passive filter per lateral, one transponder per circuit. Under it, the <b>building</b>: ring splice, entrance, riser, telecom room, demarc panel, customer router. The demarc is where our responsibility ends. ${pe("n:HOSPITAL")}</p>
<h4>Cable landing station and submerged repeater</h4><p>A landing station is a hut at the beach with one extra job: its power feed equipment drives the repeaters at sea. A repeater is an amplifier in a pressure housing on the seabed. In this model it opens as a rack like any hut, but it has no power plant, and nobody can visit it. ${pe("n:ILA-MI2","show a repeater")}</p><h4>Site power</h4><ul><li><b>On generator</b>: routine, no impact while there is fuel.</li><li><b>On battery</b>: a countdown. Dispatch before it reaches zero.</li><li><b>Dark</b>: every wave through the site is down, including express traffic.</li></ul>`],["Optics",`<h4>Channels</h4><p>40 channels on a 100 GHz grid, CH1 at 191.4 THz. The <b>spectrum strip</b> on a span shows which are lit. A wave must keep the same colour on every span of its path, so restoration needs that colour free all the way.</p>
<h4>OSNR and margin</h4><ul><li>Each span adds noise: about 58 + launch power \u2212 noise figure \u2212 span loss, in dB. Spans add as 1/OSNR, so the longest spans dominate.</li><li>Each ROADM pass adds a little more.</li><li><b>Margin</b> = OSNR \u2212 what the modulation requires. Green is comfortable, amber is thin, zero is the FEC limit.</li><li><b>Pre-FEC BER</b> rises as margin falls. It is the earliest warning you get.</li></ul>
<h4>Rates and reach</h4><ul><li>10G: needs 11 dB. Direct-detect, so limited by <b>dispersion</b> to about 80 km.</li><li>100G QPSK: 12 dB. Coherent; dispersion is undone in the DSP.</li><li>200G 16QAM: 17.5 dB. 400G 16QAM: 20.5 dB, and it takes two channel slots (<b>flex grid</b>).</li><li>This is why a 400G trunk may have no workable detour although fiber exists.</li></ul>
<h4>Amplification</h4><ul><li><b>EDFA</b> at every site. Gain is set to equal the loss of the span before it.</li><li><b>Raman</b> on spans of 100 km and more: about 3 dB better noise.</li><li><b>Nonlinear noise</b>: a small penalty on every longer span, caused by the signals themselves.</li></ul>
<h4>Things that eat margin</h4><ul><li><b>Extra span loss</b>: every channel on the span suffers; the densest modulation fails first.</li><li><b>Ageing pump</b>: the next site sees low power while the span loss reads normal.</li><li><b>Tilt</b>: a WSS stops levelling the channels; the edges of the band lose power while total power looks fine.</li><li><b>Wrong channel</b>: a transponder tuned one channel off is blocked by the first filter.</li></ul>
<h4>History graphs</h4><p>On waves and spans. A <b>step</b> is an event; a <b>slope</b> is ageing. Waves also keep worst margin per minute for four hours and 15-minute performance registers.</p>`],["Protection and restoration",`<h4>Unprotected</h4><p>One path. A cut is an outage until the splice is done.</p>
<h4>1+1 on a wave</h4><p>The light is sent down two paths at once and the receiver picks one. Switches in under 50 ms with no software. Used on access waves from dual-entrance sites and on metro trunks. It protects the path, not the shared transponder at each end.</p>
<h4>Optical restoration</h4><p>The control plane computes a new route and re-points the WSSs. About eight seconds here. It needs working controllers at both ends, the same colour free on every hop of the detour, and enough OSNR on the longer path. The wave inspector tells you which of those failed. <b>Colourless</b> trunks (Aurora\u2013Northgate) may retune to another channel; fixed-colour ones cannot.</p>
<h4>Wait-to-restore</h4><p>After a repair, traffic waits 30 s before moving back, so a flapping span cannot bounce it.</p>
<h4>OTN rerouting</h4><p>At OTN-switched gateways, circuits from a failed trunk are moved into spare slots on other trunks in under a second. The circuit shows <b>REROUTED</b> and its ticket is P2, not P1. Needs spare trunk capacity and OTN switches at every gateway used. Calder cannot do it.</p>
<h4>Protected circuit</h4><p>Design mode option. One circuit with two reserved, pre-connected trunk paths. Switches at once, also through Calder. Costs twice the trunk capacity.</p>
<h4>Diverse pair</h4><p>Design mode option. Two separate circuits, A and B, through different gateways, trunks and cables. The customer's routers do the protecting. The planner warns when both still share a lateral.</p>
<h4>What nothing protects against</h4><ul><li>A single lateral or a collapsed entrance.</li><li>Two "diverse" routes on one bridge or in one tunnel.</li><li>The transponder both legs start from.</li><li>A second failure while running on protection.</li></ul>`],["IP layer",`<h4>Routers and links</h4><p>Two core routers per metro: CR1 at the hub, CR2 at the data center. Each router link rides one or more 100G circuits. Aurora\u2013Vale is a <b>bundle</b> of two. A second plane links the data centers along Highway 1. ${pe("t:3","open the IP layer tab")}</p>
<h4>Why router links are different</h4><p>The OTN layer does not restore them. When a link's circuit goes down the routers notice within a second and send the traffic another way. Optical restoration underneath may still bring the trunk back a few seconds later.</p>
<h4>Reading the tab</h4><ul><li><b>Members</b>: circuits up out of circuits in the bundle. A dead member's ports are red.</li><li><b>Load, normal \u2192 now</b>: traffic offered on a healthy day versus right now.</li><li><b>Utilisation</b>: over 100% means packets are dropped, although nothing is down.</li><li><b>What the routers did</b>: every traffic flow that left its normal path, and where it goes now.</li></ul>
<h4>The lesson</h4><p>Congestion raises no optical alarm and opens no customer ticket. Customers report "slow". The cause is always a link that failed somewhere else and pushed its load here. Size links for the failure case.</p>`],["Alarms",()=>'<p>Severities: <span class="st cr">CR</span> service-affecting now \xB7 <span class="st mj">MJ</span> at risk or degraded \xB7 <span class="st mn">MN</span> no traffic impact yet \xB7 <span class="st wr">WR</span> information. An alarm marked ROOT is the cause; the rest are its symptoms.</p>'+Object.keys(pa).sort().map(e=>`<h4>${e}</h4><p>${pa[e]}</p>`).join("")],["NOC workflow",`<h4>Triage in five moves</h4><ul><li><b>1. Scope.</b> One wave, one degree, or everything on a span? One wave points at a transponder or pluggable. Everything points at fiber or an amplifier.</li><li><b>2. Find the edge of the light.</b> Walk upstream to the first site that still has input power. The fault sits just after it.</li><li><b>3. Check the OSC.</b> Line LOS and OSC LOS at both ends: fiber. Line LOS with the OSC up: amplifier.</li><li><b>4. One direction or both?</b> Cuts usually kill both. Cards usually kill one. BDI means the far end cannot hear you.</li><li><b>5. Client or line?</b> A clean line with client alarms is a grey optic, a jumper or the router.</li></ul>
<h4>When every wave is up and the circuit is down</h4><p>A circuit can break between segments: a missing cross-connect at a gateway, a jumper in the meet-me room, a dirty connector at the demarc. Read the layout record, then look at the hand-offs.</p>
<h4>Tickets and SLA</h4><ul><li>One ticket per affected circuit. P1 while it is down, P2 while it runs rerouted.</li><li>The SLA clock counts only seconds of real outage.</li><li><b>Next action</b> is the suggested dispatch. <b>Escalate</b> moves ownership from tier 1 to tier 2 to engineering.</li></ul>
<h4>Alarm handling</h4><p>Acknowledge alarms as you pick them up so a colleague can see what is new. Use Correlate to cut a storm down to root causes.</p>
<h4>Handover and incident report</h4><p>The <b>Shift handover report</b> lists open tickets, work in progress and known causes, with room for notes. After each drill, file the <b>incident report</b>: root cause category, how many circuits went down, corrective action.</p>
<h4>Drills and live shift</h4><ul><li>Select the faulty object and press its <b>Declare</b> button. For a span you also choose the cause. For a hand-off fault, select the circuit and declare the end.</li><li>Hints cost 25 points, wrong calls 20. Revealing the answer scores nothing.</li><li>In a live shift, a correct call dispatches the repair. You are scored on speed, wrong calls and SLA breaches.</li></ul>`],["Console","<p>The Console tab takes TL1-flavoured commands. Site arguments accept a site name, CLLI or TID.</p><h4>HELP</h4><p>Lists every command.</p><h4>SITES [text]</h4><p>Sites with name, CLLI and TID. <code>SITES AUR</code></p><h4>RTRV-ALM [site|ALL]</h4><p>Active alarms. <code>RTRV-ALM ALL</code></p><h4>RTRV-EQPT site</h4><p>Cards and pluggables by AID, with state. <code>RTRV-EQPT AUR-HUB</code></p><h4>RTRV-PM site</h4><p>Optical power per degree, and OSNR, BER and registers per wave ending there. <code>RTRV-PM CAL-HUB</code></p><h4>RTRV-CRS site</h4><p>Wavelength cross-connects in a ROADM. <code>RTRV-CRS VLY-HUB</code></p><h4>RTRV-SYS [text|site]</h4><p>Line systems, their spans and state. <code>RTRV-SYS AURRWEMA</code></p><h4>RTRV-CKT circuit-id | site</h4><p>Layout record of a circuit. <code>RTRV-CKT BANK-HQ</code></p><h4>RTRV-SVC name</h4><p>One wavelength: state, route and margin.</p><h4>TRACE system-id | site</h4><p>Fiber trace of a line system: cable, strand numbers and panel at every hop. <code>TRACE AUR-HUB</code></p><h4>RTRV-FIBER site site</h4><p>Strand assignments of the cable between two directly connected sites. <code>RTRV-FIBER AUR-HUB AUR-DC1</code></p><h4>OTDR system-id span#</h4><p>Shoots one span of a line system. Get the system ID and span numbers from RTRV-SYS.</p><h4>RTRV-IP</h4><p>Router links, load and traffic flows.</p><h4>GOTO site</h4><p>Selects a site on the map.</p>"],["Glossary",()=>Is.map(e=>`<h4>${e[0]}</h4><p>${e[1]}</p>`).join("")]],_t=e=>e.a.id+" \u2194 "+e.b.id,Qe="Select the span \u2192 under Declare, choose ",mt="Ope
